[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

# Deliberately NOT set here. `migrations/env.py` reads MIGRATION_DATABASE_URL
# from the environment, because migrations run as the PRIVILEGED role
# (`receptionai_owner`) and the app role's DSN must never be reachable from a
# config file that also serves the runtime (01 §16.1). A URL here would be the
# obvious thing to copy into a deployment and would silently run migrations as
# `receptionai_app`, which owns nothing and would fail — or worse, succeed on a
# database where the split was not yet enforced.
# sqlalchemy.url =

# UUIDv7-ordered revision ids would be nice but Alembic needs them short and
# stable; we use zero-padded sequence numbers so `alembic history` reads in
# order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
