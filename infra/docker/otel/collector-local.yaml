# ===========================================================================
# OpenTelemetry Collector — local development.
#
# Contract §1: "One instrumentation standard, swappable backends." The
# application speaks OTLP to this collector and knows nothing about Prometheus
# or Tempo. Swapping a backend is a change to this file, not to application
# code — which is the entire reason the collector exists rather than having
# services push straight to a backend.
# ===========================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
          # Browsers send traces from the Next.js admin shell on :3000.
          # Without this the preflight fails and frontend spans vanish silently.
        cors:
          allowed_origins:
            - http://localhost:3000
            - http://localhost:3001

processors:
  # Bound collector memory before the container OOMs. A collector killed by the
  # OOM reaper drops the telemetry that would have explained the incident.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    timeout: 2s
    send_batch_size: 512

  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

  # ---------------------------------------------------------------------
  # PII scrubbing at the collector, contract §8 and 05 §B6.2.
  #
  # The application redacts first; this is defence in depth. A span attribute
  # carrying a raw phone number or email is a GDPR incident that reaches the
  # trace backend, and the backend is exactly where nobody looks for one.
  # Local-only in this file, but the production collector runs the same
  # processor, so a leak shows up here first, on a developer's machine, rather
  # than in an audit.
  # ---------------------------------------------------------------------
  attributes/scrub_pii:
    actions:
      - key: db.statement
        action: delete          # log_statement=all already covers local SQL
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: enduser.id
        action: hash
      - key: customer.email
        action: delete
      - key: customer.phone
        action: delete

exporters:
  # Metrics are pulled by Prometheus from :8889 rather than pushed, matching
  # production's ServiceMonitor scrape model.
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true            # local only; in-cluster mTLS in production

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  debug:
    verbosity: normal

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/scrub_pii, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/scrub_pii, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs:
      level: info
    metrics:
      # The collector's OWN metrics (queue depth, refused/dropped spans).
      # Must bind 0.0.0.0, not the default localhost: Prometheus scrapes this
      # from another container, and a localhost bind is unreachable across the
      # network namespace — the target simply reports down. Distinct from the
      # :8889 exporter above, which carries APPLICATION metrics. A collector
      # silently dropping spans while otherwise healthy is invisible without it.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
