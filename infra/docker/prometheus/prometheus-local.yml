# Prometheus — local development scrape config.
# Targets mirror the production ServiceMonitors so a dashboard built locally
# keeps working against the real cluster.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics arrive over OTLP and are re-exported by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: receptionai

  # The collector's own health, separate from what it forwards. A collector
  # dropping spans while otherwise healthy is invisible without this.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # Direct scrapes. These fail until the owning app exists, which is expected
  # on a fresh clone: Prometheus reports the target down and keeps running.
  - job_name: receptionai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # apps/media exports receptionai_voice_active_sessions and
  # receptionai_voice_session_capacity — contract amendments A1 and A7 make
  # both cross-document dependencies, and §E19.4 drives the HPA off their
  # ratio. Scraped locally so the signal is verifiable before it is load-bearing.
  - job_name: receptionai-media
    metrics_path: /metrics
    static_configs:
      - targets: ["media:8100"]

  - job_name: temporal
    static_configs:
      - targets: ["temporal:9090"]
